name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Audit runtime dependencies
        # Runtime dependencies must be clean. Dev-toolchain advisories are reported
        # separately so they cannot block a release but also cannot be ignored.
        run: npm audit --omit=dev --audit-level=high

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  # Exercises the cache and generation-record paths against a real Redis, which the
  # unit suites deliberately mock away.
  integration-redis:
    runs-on: ubuntu-latest
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests against a live Redis
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rendermind:test .

      - name: Start container
        run: |
          docker run -d --name rendermind-smoke -p 3000:3000 \
            -e NODE_ENV=development rendermind:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "service did not become live"
          docker logs rendermind-smoke
          exit 1
        # A container that boots but never serves is not a working artifact, so this
        # probes liveness rather than merely asserting the process started.

      - name: Exercise the public surface against the container
        run: |
          # /readyz proves a provider is configured; the image endpoints are exercised
          # for validation and error behaviour, which need no upstream credential.
          curl -fsS http://localhost:3000/readyz > /dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/chat \
            -H 'Content-Type: application/json' -d '{"prompt":"a red apple"}')
          test "$status" = "400" -o "$status" = "503"
          # A malformed body is always a 400 in the one envelope.
          curl -fsS -X POST http://localhost:3000/chat -H 'Content-Type: application/json' \
            -d '{}' | grep -q 'invalid_request_error'

      - name: Container health status
        run: test "$(docker inspect --format '{{.State.Health.Status}}' rendermind-smoke)" = "healthy"

      - name: Show logs on failure
        if: failure()
        run: docker logs rendermind-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f rendermind-smoke
